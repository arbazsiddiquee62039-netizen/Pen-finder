const norm=s=>s.toUpperCase().replace(/[^A-Z ]/g," ").replace(/\s+/g," ").trim();
const idx=D.map(r=>({r,n:norm(r[1])}));

function run(){

}
out.addEventListener("click",e=>{const b=e.target.closest(".copy");if(!b)return;
